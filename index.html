<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10">
<title>QMKJCM Status</title><meta name="description" content="倾慕官机平台服务状态">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f2f4f7;background:#0a0c0f;--card:#111418;--line:#252a31;--muted:#949ba7;--green:#20c997;--yellow:#f5b940;--red:#f97066}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#1d2939 0,#0a0c0f 40%);color:#f5f7fa}.shell{max-width:1050px;margin:auto;padding:0 24px 70px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}.brand{display:flex;gap:11px;align-items:center;font-weight:750}.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#cfd4dc);color:#0a0c0f;font-weight:900}.navmeta{font-size:13px;color:var(--muted)}.hero{padding:80px 0 42px;text-align:center}.hero h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.045em;margin:0 0 16px}.hero p{margin:0 auto;color:var(--muted);font-size:17px;max-width:620px;line-height:1.7}.summary{margin:0 auto 32px;border:1px solid var(--line);background:#101317dd;border-radius:18px;padding:23px;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 24px 70px #0005}.summary-main{display:flex;align-items:center;gap:15px}.orb{width:16px;height:16px;border-radius:50%;background:#7b8491}.orb.up{background:var(--green);box-shadow:0 0 0 7px #20c9971c}.orb.down{background:var(--red);box-shadow:0 0 0 7px #f970661c}.orb.warn{background:var(--yellow);box-shadow:0 0 0 7px #f5b9401c}.summary b{font-size:20px}.summary small{display:block;color:var(--muted);margin-top:4px}.btn{border:1px solid #343a43;background:#191d22;color:#e7eaf0;padding:10px 15px;border-radius:10px;font-weight:650;cursor:pointer}.btn:hover{background:#232830}.btn:disabled{opacity:.5}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.section h2{margin:0;font-size:19px}.section-desc{font-size:13px;color:var(--muted)}.service-list{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}.service{display:grid;grid-template-columns:minmax(180px,1fr) 145px 120px 110px;align-items:center;gap:16px;padding:19px 21px;border-bottom:1px solid var(--line)}.service:last-child{border-bottom:0}.service-name{font-weight:700}.service-sub{font-size:12px;color:var(--muted);margin-top:4px}.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:#7b8491}.status.up{color:#67e7bf}.status.up:before{background:var(--green)}.status.down{color:#ffaaa3}.status.down:before{background:var(--red)}.status.warn{color:#ffd27b}.status.warn:before{background:var(--yellow)}.metric{font-variant-numeric:tabular-nums;color:#c6cbd3;font-size:13px}.bars{display:flex;gap:3px;justify-content:flex-end;align-items:center}.bars i{display:block;width:5px;height:22px;border-radius:3px;background:#273038;cursor:pointer;transition:transform .12s,filter .12s}.bars i:hover{transform:scaleY(1.28);filter:brightness(1.35)}.bars i.up{background:#238f73}.bars i.down{background:#8f3833}.incident{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--card);display:flex;gap:15px}.incident-icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#1a2026;color:#aeb5c0}.incident b{display:block;margin-bottom:6px}.incident p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.footer{margin-top:45px;padding-top:22px;border-top:1px solid #ffffff12;display:flex;justify-content:space-between;color:#737b87;font-size:12px}.loading{padding:30px;color:var(--muted)}.detail-modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:#0009}.detail-modal.on{display:flex}.detail-box{width:min(430px,100%);border:1px solid #343a43;border-radius:18px;background:#15191e;box-shadow:0 24px 80px #0008;padding:22px}.detail-box h3{margin:0 0 6px;font-size:20px}.detail-box p{margin:7px 0;color:#b7bec8;font-size:13px;line-height:1.75}.detail-box .close-detail{width:100%;margin-top:13px}@media(max-width:720px){.shell{padding:0 14px 50px}.topbar{height:64px}.hero{padding:55px 0 30px}.summary{align-items:flex-start;flex-direction:column}.service{grid-template-columns:1fr auto;padding:17px}.service .metric{grid-column:1}.bars{grid-column:2;grid-row:2}.section-head{align-items:flex-start;flex-direction:column;gap:5px}.footer{flex-direction:column;gap:8px}}

/* Visual refresh */
:root{--accent:#8b7cff;--accent-2:#55d6ff;--card:#121821;--line:#263140}
body{background:radial-gradient(900px 500px at 15% -10%,#26366b55,transparent 60%),radial-gradient(700px 450px at 100% 0%,#16465a44,transparent 58%),#080b10}
.shell{max-width:1120px}
.topbar{border-bottom-color:#ffffff14}
.logo{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 24px #6e67ff44}
.brand{letter-spacing:.01em}
.navmeta{padding:7px 11px;border:1px solid #ffffff14;border-radius:999px;background:#ffffff08}
.hero{padding:92px 0 42px}
.hero h1{font-weight:850;background:linear-gradient(110deg,#fff 15%,#bfc8ff 52%,#76e5ff 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:680px;color:#aab4c3}
.summary{border-color:#ffffff1c;background:linear-gradient(120deg,#171f2cdd,#10151ddd);box-shadow:0 25px 80px #0007,0 0 0 1px #ffffff05 inset}
.summary b{letter-spacing:-.02em}
.btn{border-color:#ffffff20;background:linear-gradient(180deg,#252c38,#191f29);box-shadow:0 5px 14px #0003}
.btn:hover{border-color:#8b7cff88;background:linear-gradient(180deg,#30384a,#202836);transform:translateY(-1px)}
.service-list{border-color:#ffffff1a;background:#0e131a;box-shadow:0 18px 50px #0004}
.service{padding:22px 23px;border-bottom-color:#ffffff12;transition:background .18s,transform .18s}
.service:hover{background:linear-gradient(90deg,#1a2230,#131a24);position:relative;z-index:1}
.service-name{font-size:15px;letter-spacing:.01em}
.service-sub{color:#8491a3}
.status{justify-self:start;padding:7px 10px;border:1px solid currentColor;border-radius:999px;background:#ffffff06}
.metric{color:#d7deea}
.bars i{width:6px;height:24px;border-radius:4px;opacity:.9}
.incident{border-color:#ffffff1a;background:linear-gradient(120deg,#151c26,#11171f);box-shadow:0 14px 35px #0003}
.incident-icon{background:#202a36}
.footer{border-top-color:#ffffff14}
.detail-box{border-color:#ffffff24;background:linear-gradient(145deg,#1a222e,#11161d)}
@media(max-width:720px){.hero{padding-top:66px}.service{padding:18px 16px}.status{justify-self:end}}
</style></head>
<body><div class="shell"><header class="topbar"><div class="brand"><span class="logo">Q</span><span>QMKJCM Status</span></div><div class="navmeta">实时监控 · 2026.09 优化版</div></header><main><section class="hero"><h1>系统运行状态</h1><p>实时展示倾慕官机平台核心服务的可用性与响应情况。发生异常时，我们会第一时间处理并同步进展。</p></section><section class="summary"><div class="summary-main"><span id="overallOrb" class="orb"></span><div><b id="overallText">正在检查服务状态</b><small id="updatedText">正在连接外部监控系统</small></div></div><button id="refreshBtn" class="btn" onclick="loadStatus(true)">重新检查</button></section><section class="section"><div class="section-head"><div><h2>核心服务</h2><div class="section-desc">实时可用性、延迟与过去30天运行情况</div></div><div class="section-desc">自动刷新：5分钟</div></div><div id="services" class="service-list"><div class="loading">正在加载服务状态…</div></div></section><section class="section"><div class="section-head"><div><h2>近期事件</h2><div class="section-desc">服务中断、性能下降与维护记录</div></div></div><div id="incidents"><div class="incident"><div class="incident-icon">…</div><div><b>正在读取真实事件记录</b><p>请稍候。</p></div></div></div></section></main><footer class="footer"><span>© 2026 QMKJCM</span><span>状态由独立外部监控节点提供</span></footer></div><div id="detailModal" class="detail-modal" onclick="if(event.target===this)closeDetail()"><div class="detail-box"><h3 id="detailTitle">监控详情</h3><p id="detailBody"></p><button class="btn close-detail" onclick="closeDetail()">关闭</button></div></div><script>
(function(){'use strict';var box=document.getElementById('services'),incidentBox=document.getElementById('incidents'),orb=document.getElementById('overallOrb'),overall=document.getElementById('overallText'),updated=document.getElementById('updatedText'),btn=document.getElementById('refreshBtn');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function state(s){return s==='up'?['up','正常运行']:s==='down'?['down','服务中断']:['warn','性能下降']}function formatDate(d){if(!d||isNaN(d.getTime()))return'—';return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)}function fmtTime(sec){return sec?formatDate(new Date(Number(sec)*1000)):'—'}function fmtIso(v){return v?formatDate(new Date(v)):'—'}function duration(sec){sec=Number(sec)||0;if(sec<60)return sec+'秒';if(sec<3600)return Math.round(sec/60)+'分钟';if(sec<86400)return (sec/3600).toFixed(1)+'小时';return (sec/86400).toFixed(1)+'天'}function openDetail(service,domain,at,ms){document.getElementById('detailTitle').textContent=service;document.getElementById('detailBody').innerHTML='监控时间：'+esc(fmtTime(at))+'<br>响应耗时：'+esc(ms)+' ms<br>监控域名：'+esc(domain||'未公开')+'<br>数据来源：UptimeRobot真实检查记录';document.getElementById('detailModal').classList.add('on')}function closeDetail(){document.getElementById('detailModal').classList.remove('on')}window.closeDetail=closeDetail;document.addEventListener('click',function(e){var x=e.target.closest&&e.target.closest('.bars i[data-at]');if(x)openDetail(x.dataset.service||'监控详情',x.dataset.domain||'',Number(x.dataset.at||0),Number(x.dataset.ms||0))});function realBars(points,st,service,domain){var arr=Array.isArray(points)?points.slice().reverse():[];if(!arr.length)return '<span class="muted">暂无趋势</span>';return arr.map(function(p){var cls=st==='down'?'down':(p.ms>5000?'down':'up');return '<i class="'+cls+'" title="'+esc(fmtTime(p.at))+' · '+esc(p.ms)+' ms" data-service="'+esc(service)+'" data-domain="'+esc(domain||'')+'" data-at="'+Number(p.at)+'" data-ms="'+Number(p.ms)+'"></i>'}).join('')}function renderIncidents(list){var rows=[];list.forEach(function(s){(s.incidents||[]).forEach(function(e){if(e.type==='down')rows.push({service:s.name,at:e.at,duration:e.duration,reason:e.reason})})});rows.sort(function(a,b){return b.at-a.at});if(!rows.length){incidentBox.innerHTML='<div class="incident"><div class="incident-icon">✓</div><div><b>暂无历史中断事件</b><p>UptimeRobot当前没有返回这些服务的中断记录。</p></div></div>';return}incidentBox.innerHTML=rows.slice(0,5).map(function(e){return '<div class="incident" style="margin-bottom:10px"><div class="incident-icon">!</div><div><b>'+esc(e.service)+' 曾发生中断</b><p>'+esc(fmtTime(e.at))+' · 持续 '+esc(duration(e.duration))+(e.reason?' · '+esc(e.reason):'')+'</p></div></div>'}).join('')}function render(d){var list=Array.isArray(d.services)?d.services:[],down=list.filter(function(x){return x.status==='down'}).length,warn=list.filter(function(x){return x.status==='warn'}).length,st=down?'down':warn?'warn':list.length?'up':'warn';orb.className='orb '+st;overall.textContent=st==='up'?'所有系统运行正常':st==='down'?'部分系统服务中断':'部分系统性能下降';updated.textContent=d.updated_at?'页面数据更新：'+fmtIso(d.updated_at):'暂时无法获取完整监控数据';box.innerHTML=list.length?list.map(function(x){var m=state(x.status),uptime=x.uptime_30d?Number(x.uptime_30d).toFixed(3)+'%':'—',delay=x.response_times&&x.response_times[0]?x.response_times[0].ms:(x.average_response_time||null),last=x.response_times&&x.response_times[0]?fmtTime(x.response_times[0].at):'—';return '<div class="service"><div><div class="service-name">'+esc(x.name)+'</div><div class="service-sub">'+(x.domain?esc(x.domain)+' · ':'')+esc(x.type||'监控')+' · 每'+esc(Math.round((x.interval_seconds||300)/60))+'分钟检查</div><div class="service-sub">当前检查 '+esc(fmtIso(x.edge_checked_at))+' · HTTP '+esc(x.edge_status||'—')+'</div><div class="service-sub">外部数据截至 '+esc(last)+((x.response_times&&x.response_times[0]&&Date.now()/1000-x.response_times[0].at>900)?' · 数据延迟':'')+' · 30天可用率 '+esc(uptime)+'</div></div><div class="status '+m[0]+'">'+m[1]+'</div><div class="metric">外部最新 '+(delay!=null?esc(delay)+' ms':'—')+'<br><span class="service-sub">EdgeOne实时 '+(x.edge_latency_ms!=null?esc(x.edge_latency_ms)+' ms':'不可用')+' · 外部平均 '+(x.average_response_time!=null?esc(x.average_response_time)+' ms':'—')+'</span></div><div class="bars">'+realBars(x.response_times,m[0],x.name,x.domain)+'</div></div>'}).join(''):'<div class="loading">暂时无法获取监控数据，请稍后重新检查。</div>';renderIncidents(list)}function loadStatus(manual){if(btn.disabled)return;btn.disabled=true;if(manual)btn.textContent='检查中…';fetch('/api/status'+(location.search||''),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error(String(r.status));return r.json()}).then(render).catch(function(){render({services:[],updated_at:''})}).finally(function(){btn.disabled=false;btn.textContent='重新检查'})}window.openDetail=openDetail;window.loadStatus=loadStatus;loadStatus(false);setInterval(function(){loadStatus(false)},300000)})();
</script></body></html>
