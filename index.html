<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>QMKJCM Status</title>
<meta name="description" content="倾慕系列服务状态">
<style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#202124;background:#fff;--green:#16834b;--green-bg:#eaf7ef;--line:#e6e6e6;--muted:#6b6f76;--ink:#202124}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink)}.wrap{max-width:1000px;margin:0 auto;padding:0 26px}
header{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650}.mark{width:28px;height:28px;border-radius:7px;background:#111;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800}.header-right{font-size:13px;color:var(--muted)}
main{padding:62px 0 78px}.hero{margin-bottom:48px}.hero h1{font-size:42px;line-height:1.1;letter-spacing:-.04em;margin:0 0 13px;font-weight:720}.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.65}
.status-banner{display:flex;align-items:center;gap:16px;padding:22px 24px;border-radius:10px;background:var(--green-bg);border:1px solid #ccebd8;margin-bottom:48px}.status-icon{width:13px;height:13px;border-radius:50%;background:#27a463;box-shadow:0 0 0 5px #27a4631c;flex:none}.status-copy strong{display:block;font-size:18px;font-weight:680}.status-copy span{display:block;color:#4e735f;font-size:13px;margin-top:5px}.status-time{margin-left:auto;text-align:right;color:#5d7568;font-size:12px;line-height:1.55}
.section-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.section-title h2{font-size:18px;margin:0;font-weight:680}.section-title span{font-size:12px;color:var(--muted)}
.panel{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.group-label{padding:15px 20px 12px;background:#fafafa;border-bottom:1px solid var(--line);font-size:13px;font-weight:650;color:#4b4e53}.service{display:grid;grid-template-columns:minmax(210px,1fr) 220px 118px;align-items:center;gap:20px;min-height:94px;padding:16px 20px;border-bottom:1px solid var(--line)}.service:last-child{border-bottom:0}.service-name{font-weight:620;font-size:15px}.service-meta{margin-top:5px;color:var(--muted);font-size:12px}.service-chart{height:48px}.sparkline{display:block;width:100%;height:100%}.chart-caption{display:flex;justify-content:space-between;margin-top:3px;color:#9a9da3;font-size:10px}.service-status{text-align:right;font-size:13px;font-weight:600;color:var(--green)}.service-status:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#28a464;margin-right:7px}.service-status.warn{color:#9a6b00}.service-status.warn:before{background:#d79c22}.service-status.down{color:#b33b3b}.service-status.down:before{background:#d9534f}.uptime{display:flex;gap:3px;height:22px;align-items:end;margin-top:9px}.uptime i{display:block;flex:1;height:100%;min-width:2px;border-radius:2px;background:#d9efe1}.uptime i.down{background:#f0b5b5}.uptime i.warn{background:#f1d79a}
.history{display:flex;justify-content:center;margin-top:17px}.history a{color:#555;text-decoration:none;font-size:13px;border-bottom:1px solid #bbb;padding-bottom:2px}.history a:hover{color:#111;border-color:#111}
.events{margin-top:46px}.event-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}.event{display:flex;gap:13px;padding:17px 20px;border-bottom:1px solid var(--line)}.event:last-child{border:0}.event-dot{width:9px;height:9px;border-radius:50%;background:#d9534f;margin-top:5px;flex:none}.event b{font-size:13px;font-weight:620}.event p{margin:5px 0 0;color:var(--muted);font-size:12px}.empty{padding:23px;color:var(--muted);font-size:13px;text-align:center}
footer{border-top:1px solid var(--line);padding:22px 0 30px;color:#8a8d92;font-size:12px;display:flex;justify-content:space-between;gap:15px}
.loading{padding:40px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:720px){.wrap{padding:0 16px}header{height:62px}.header-right{font-size:11px}main{padding:42px 0 58px}.hero h1{font-size:34px}.status-banner{align-items:flex-start;padding:18px}.status-time{font-size:11px}.service{grid-template-columns:1fr auto;gap:9px 14px;padding:17px 16px}.service-chart{grid-column:1 / -1;grid-row:2}.service-status{grid-column:2;grid-row:1}.uptime{margin-top:7px}.section-title{align-items:flex-start;gap:5px;flex-direction:column}footer{flex-direction:column;gap:7px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><span class="mark">Q</span><span>QMKJCM Status</span></div><div class="header-right">实时监控 · 自动刷新 5 分钟</div></header>
<main>
<section class="hero"><h1>服务状态</h1><p>倾慕系列服务的实时运行情况与历史可用性。</p></section>
<section class="status-banner"><span id="statusIcon" class="status-icon"></span><div class="status-copy"><strong id="overall">正在检查服务状态</strong><span id="overallDesc">正在连接监控系统</span></div><div id="updated" class="status-time">—</div></section>
<section><div class="section-title"><h2>系统状态</h2><span>最近 30 天</span></div><div id="services" class="panel"><div class="loading">正在加载…</div></div><div class="history"><a href="https://github.com/qmkjcm/status/commits/main" target="_blank" rel="noopener">查看状态页更新记录 →</a></div></section>
<section class="events"><div class="section-title"><h2>近期事件</h2><span>服务中断与维护</span></div><div id="incidents" class="event-list"><div class="loading">正在读取…</div></div></section>
</main>
<footer><span>© 2026 QMKJCM</span><span>数据由独立外部监控节点提供</span></footer>
</div>
<script>
(function(){
'use strict';
var box=document.getElementById('services'),events=document.getElementById('incidents');
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(v){var d=new Date(v);if(isNaN(d.getTime()))return'—';var p=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),o={};p.forEach(function(x){o[x.type]=x.value});return o.year+'-'+o.month+'-'+o.day+' '+o.hour+':'+o.minute}
function ts(v){return v?fmt(Number(v)*1000)+' 北京时间':'—'}
function state(s){return s==='down'?['down','服务中断']:s==='warn'?['warn','性能下降']:['up','正常运行']}
function spark(points,status){var a=Array.isArray(points)?points.slice().reverse().filter(function(x){return Number(x.ms)>=0}):[];if(!a.length)return'';var vals=a.map(function(x){return Number(x.ms)||0}),min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),span=max-min||1,w=320,h=48,p=4,pts=a.map(function(x,i){var xx=p+(w-p*2)*(a.length===1?1:i/(a.length-1)),yy=h-p-(h-p*2)*((Number(x.ms)-min)/span);return xx.toFixed(1)+','+yy.toFixed(1)}).join(' '),color=status==='down'?'#d9534f':status==='warn'?'#c28a12':'#2b9c62';return'<svg class="sparkline" viewBox="0 0 320 48" preserveAspectRatio="none" aria-label="响应时间趋势"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>'}
function uptimeBars(points,status){var a=Array.isArray(points)?points.slice(0,30):[];if(!a.length)return'';return'<div class="uptime">'+a.map(function(x){var c=status==='down'?'down':Number(x.ms)>5000?'warn':'up';return'<i class="'+c+'" title="'+esc(ts(x.at))+'"></i>'}).join('')+'</div>'}
function renderIncidents(list){var rows=[];list.forEach(function(s){(s.incidents||[]).forEach(function(e){if(e.type==='down')rows.push({name:s.name,at:e.at,duration:e.duration,reason:e.reason})})});rows.sort(function(a,b){return b.at-a.at});if(!rows.length){events.innerHTML='<div class="empty">最近没有服务中断事件</div>';return}events.innerHTML=rows.slice(0,6).map(function(e){return'<div class="event"><span class="event-dot"></span><div><b>'+esc(e.name)+' 曾发生中断</b><p>'+esc(ts(e.at))+' · 持续 '+esc((Number(e.duration)||0)<60?(Number(e.duration)||0)+' 秒':Math.round((Number(e.duration)||0)/60)+' 分钟')+(e.reason?' · '+esc(e.reason):'')+'</p></div></div>'}).join('')}
function render(data){var list=Array.isArray(data.services)?data.services:[],up=list.filter(function(x){return x.status==='up'}).length,down=list.filter(function(x){return x.status==='down'}).length,warn=list.filter(function(x){return x.status==='warn'}).length,total=list.length,good=!down&&!warn&&total;document.getElementById('overall').textContent=down?'部分系统服务中断':warn?'部分系统性能下降':good?'所有系统正常':'暂时无法获取状态';document.getElementById('overallDesc').textContent=down?'我们正在处理受影响的服务。':warn?'部分服务响应较慢，请稍后再查看。':good?'我们没有发现影响服务的问题。':'请稍后重新检查。';document.getElementById('updated').textContent=data.updated_at?'更新于 '+fmt(data.updated_at)+' 北京时间':'—';document.getElementById('statusIcon').style.background=down?'#d9534f':warn?'#d79c22':'#27a463';box.innerHTML=list.length?'<div class="group-label">倾慕系列服务</div>'+list.map(function(x){var st=state(x.status),last=x.response_times&&x.response_times[0],delay=last?last.ms:(x.edge_latency_ms!=null?x.edge_latency_ms:null),rate=x.uptime_30d?Number(x.uptime_30d).toFixed(2)+'%':'—',latest=x.edge_checked_at?fmt(x.edge_checked_at)+' 北京时间':(last?ts(last.at):'—'),latestLabel=x.edge_checked_at?'页面探测':'外部历史记录';return'<div class="service"><div><div class="service-name">'+esc(x.name)+'</div><div class="service-meta">'+esc(x.domain||'未公开域名')+' · '+esc(x.type||'监控')+' · 可用率 '+esc(rate)+'</div>'+uptimeBars(x.response_times,st[0])+'</div><div class="service-chart">'+spark(x.response_times,st[0])+'<div class="chart-caption"><span>最近响应趋势</span><span>'+esc(latest)+'</span></div></div><div class="service-status '+st[0]+'">'+st[1]+'<br><small style="font-weight:400;color:#85888d">'+(delay!=null?esc(delay)+' ms':'—')+'</small></div></div>'}).join(''):'<div class="empty">暂时无法获取监控数据，请稍后重试。</div>';renderIncidents(list)}
function load(){var timeout=new Promise(function(_,reject){setTimeout(function(){reject(Error('timeout'))},8000)});Promise.race([fetch('/api/status',{cache:'no-store'}),timeout]).then(function(r){if(!r.ok)throw Error(String(r.status));return r.json()}).then(render).catch(function(error){document.getElementById('overall').textContent='暂时无法获取状态';document.getElementById('overallDesc').textContent='接口请求失败，请稍后重试（'+esc(error&&error.message||'network_error')+'）';document.getElementById('updated').textContent='—';box.innerHTML='<div class="empty">暂时无法获取监控数据，请稍后重试。</div>';events.innerHTML='<div class="empty">事件数据暂时不可用</div>'})}
load();setInterval(load,300000);
})();
</script>
</body>
</html>
