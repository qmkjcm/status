<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10">
<title>QMKJCM Status</title><meta name="description" content="倾慕官机平台服务状态">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f2f4f7;background:#0a0c0f;--card:#111418;--line:#252a31;--muted:#949ba7;--green:#20c997;--yellow:#f5b940;--red:#f97066}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#1d2939 0,#0a0c0f 40%);color:#f5f7fa}.shell{max-width:1050px;margin:auto;padding:0 24px 70px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}.brand{display:flex;gap:11px;align-items:center;font-weight:750}.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#cfd4dc);color:#0a0c0f;font-weight:900}.navmeta{font-size:13px;color:var(--muted)}.hero{padding:80px 0 42px;text-align:center}.hero h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.045em;margin:0 0 16px}.hero p{margin:0 auto;color:var(--muted);font-size:17px;max-width:620px;line-height:1.7}.summary{margin:0 auto 32px;border:1px solid var(--line);background:#101317dd;border-radius:18px;padding:23px;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 24px 70px #0005}.summary-main{display:flex;align-items:center;gap:15px}.orb{width:16px;height:16px;border-radius:50%;background:#7b8491}.orb.up{background:var(--green);box-shadow:0 0 0 7px #20c9971c}.orb.down{background:var(--red);box-shadow:0 0 0 7px #f970661c}.orb.warn{background:var(--yellow);box-shadow:0 0 0 7px #f5b9401c}.summary b{font-size:20px}.summary small{display:block;color:var(--muted);margin-top:4px}.btn{border:1px solid #343a43;background:#191d22;color:#e7eaf0;padding:10px 15px;border-radius:10px;font-weight:650;cursor:pointer}.btn:hover{background:#232830}.btn:disabled{opacity:.5}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.section h2{margin:0;font-size:19px}.section-desc{font-size:13px;color:var(--muted)}.service-list{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}.service{display:grid;grid-template-columns:minmax(180px,1fr) 145px 120px 110px;align-items:center;gap:16px;padding:19px 21px;border-bottom:1px solid var(--line)}.service:last-child{border-bottom:0}.service-name{font-weight:700}.service-sub{font-size:12px;color:var(--muted);margin-top:4px}.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:#7b8491}.status.up{color:#67e7bf}.status.up:before{background:var(--green)}.status.down{color:#ffaaa3}.status.down:before{background:var(--red)}.status.warn{color:#ffd27b}.status.warn:before{background:var(--yellow)}.metric{font-variant-numeric:tabular-nums;color:#c6cbd3;font-size:13px}.bars{display:flex;gap:3px;justify-content:flex-end}.bars i{display:block;width:4px;height:18px;border-radius:2px;background:#273038}.bars i.up{background:#238f73}.bars i.down{background:#8f3833}.incident{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--card);display:flex;gap:15px}.incident-icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#1a2026;color:#aeb5c0}.incident b{display:block;margin-bottom:6px}.incident p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.footer{margin-top:45px;padding-top:22px;border-top:1px solid #ffffff12;display:flex;justify-content:space-between;color:#737b87;font-size:12px}.loading{padding:30px;color:var(--muted)}@media(max-width:720px){.shell{padding:0 14px 50px}.topbar{height:64px}.hero{padding:55px 0 30px}.summary{align-items:flex-start;flex-direction:column}.service{grid-template-columns:1fr auto;padding:17px}.service .metric{grid-column:1}.bars{grid-column:2;grid-row:2}.section-head{align-items:flex-start;flex-direction:column;gap:5px}.footer{flex-direction:column;gap:8px}}
</style></head>
<body><div class="shell"><header class="topbar"><div class="brand"><span class="logo">Q</span><span>QMKJCM Status</span></div><div class="navmeta">Service Health</div></header><main><section class="hero"><h1>系统运行状态</h1><p>实时展示倾慕官机平台核心服务的可用性与响应情况。发生异常时，我们会第一时间处理并同步进展。</p></section><section class="summary"><div class="summary-main"><span id="overallOrb" class="orb"></span><div><b id="overallText">正在检查服务状态</b><small id="updatedText">正在连接外部监控系统</small></div></div><button id="refreshBtn" class="btn" onclick="loadStatus(true)">重新检查</button></section><section class="section"><div class="section-head"><div><h2>核心服务</h2><div class="section-desc">实时可用性、延迟与过去30天运行情况</div></div><div class="section-desc">自动刷新：5分钟</div></div><div id="services" class="service-list"><div class="loading">正在加载服务状态…</div></div></section><section class="section"><div class="section-head"><div><h2>近期事件</h2><div class="section-desc">服务中断、性能下降与维护记录</div></div></div><div class="incident"><div class="incident-icon">✓</div><div><b>当前没有进行中的事件</b><p>所有核心服务均按计划运行。如果出现服务波动，本区域会展示事件状态和恢复进度。</p></div></div></section></main><footer class="footer"><span>© 2026 QMKJCM</span><span>状态由独立外部监控节点提供</span></footer></div><script>
(function(){'use strict';var box=document.getElementById('services'),orb=document.getElementById('overallOrb'),overall=document.getElementById('overallText'),updated=document.getElementById('updatedText'),btn=document.getElementById('refreshBtn');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function state(s){return s==='up'?['up','正常运行']:s==='down'?['down','服务中断']:['warn','性能下降']}function bars(st){var a=[];for(var i=0;i<18;i++)a.push('<i class="'+(st==='down'&&i>13?'down':'up')+'"></i>');return a.join('')}function render(d){var list=Array.isArray(d.services)?d.services:[],down=list.filter(function(x){return x.status==='down'}).length,warn=list.filter(function(x){return x.status==='warn'}).length,st=down?'down':warn?'warn':list.length?'up':'warn';orb.className='orb '+st;overall.textContent=st==='up'?'所有系统运行正常':st==='down'?'部分系统服务中断':'部分系统性能下降';updated.textContent=d.updated_at?'最后更新：'+new Date(d.updated_at).toLocaleString('zh-CN',{hour12:false}):'暂时无法获取完整监控数据';box.innerHTML=list.length?list.map(function(x){var m=state(x.status),uptime=x.uptime_30d?Number(x.uptime_30d).toFixed(2)+'%':'—',delay=x.response_time_ms!=null?x.response_time_ms+' ms':'—';return '<div class="service"><div><div class="service-name">'+esc(x.name)+'</div><div class="service-sub">过去30天可用率 '+esc(uptime)+'</div></div><div class="status '+m[0]+'">'+m[1]+'</div><div class="metric">响应 '+esc(delay)+'</div><div class="bars">'+bars(m[0])+'</div></div>'}).join(''):'<div class="loading">暂时无法获取监控数据，请稍后重新检查。</div>'}function loadStatus(manual){if(btn.disabled)return;btn.disabled=true;if(manual)btn.textContent='检查中…';fetch('/api/status'+(location.search||''),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error(String(r.status));return r.json()}).then(render).catch(function(){render({services:[],updated_at:''})}).finally(function(){btn.disabled=false;btn.textContent='重新检查'})}window.loadStatus=loadStatus;loadStatus(false);setInterval(function(){loadStatus(false)},300000)})();
</script></body></html>
