<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff"><title>QMKJCM Status</title>
<style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#171717;background:#fff;--green:#20b486;--green-dark:#168b68;--green-bg:#d9f7ed;--yellow:#f5b629;--red:#f47768;--line:#e7e7e7;--muted:#8a8a8a}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717}.wrap{max-width:838px;margin:auto;padding:0 20px}header{height:86px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:27px;letter-spacing:-.045em;font-weight:720}.subscribe{padding:11px 15px;border-radius:7px;background:#29292d;color:#fff;text-decoration:none;font-size:13px;font-weight:650}.subscribe:hover{background:#111}main{padding:50px 0 76px}.hero{margin-bottom:34px}.hero h1{font-size:32px;letter-spacing:-.035em;margin:0 0 9px;font-weight:680}.hero p{margin:0;color:#777;font-size:14px}.status-box{border:1px solid var(--green);border-radius:9px;overflow:hidden;margin-bottom:31px}.status-head{display:flex;align-items:center;gap:11px;padding:21px;background:var(--green-bg);font-size:18px}.check{width:19px;height:19px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}.status-body{padding:21px;font-size:14px;color:#333;display:flex;justify-content:space-between;gap:15px}.status-time{color:#777;font-size:12px;text-align:right}.system-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 13px}.system-head h2{font-size:18px;margin:0;font-weight:650}.range{display:flex;align-items:center;gap:12px;color:#8b8b8b;font-size:13px}.arrow{font-size:22px;color:#b1b1b1;line-height:10px}.panel{border:1px solid var(--line);border-radius:9px;overflow:hidden}.panel-head{height:63px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);font-size:14px;font-weight:650;background:#fcfcfc}.service{padding:18px 20px 19px;border-bottom:1px solid var(--line)}.service:last-child{border-bottom:0}.service-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.service-title{display:flex;align-items:center;gap:10px;min-width:0}.service-title .check{width:20px;height:20px;font-size:12px}.service-name{font-size:15px;font-weight:570;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.service-meta{color:#969696;font-size:13px;margin-left:30px;margin-top:4px}.uptime-value{color:#858585;font-size:13px;white-space:nowrap}.bars{display:flex;gap:3px;height:21px;align-items:stretch;margin-top:12px}.bars i{flex:1;min-width:2px;border-radius:1px;background:#a9e7d3}.bars i.warn{background:#ffd15c}.bars i.down{background:#ff8b7d}.bars i:hover{filter:brightness(.9);transform:scaleY(1.15)}.legend{display:flex;justify-content:space-between;color:#aaa;font-size:11px;margin-top:7px}.history{display:flex;justify-content:center;margin:28px 0 0}.history a{display:inline-flex;align-items:center;gap:8px;border:1px solid #d4d4d4;border-radius:7px;padding:11px 15px;color:#242424;text-decoration:none;font-size:13px}.history a:hover{background:#fafafa;border-color:#aaa}.calendar{font-size:16px}.events{margin-top:51px}.events h2{font-size:18px;margin:0 0 13px;font-weight:650}.event-box{border:1px solid var(--line);border-radius:9px;overflow:hidden}.event{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:11px}.event:last-child{border-bottom:0}.event-dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:5px;flex:none}.event b{font-size:13px;font-weight:600}.event p{margin:5px 0 0;color:#888;font-size:12px}.empty{padding:23px;text-align:center;color:#929292;font-size:13px}footer{border-top:1px solid var(--line);padding:23px 0 30px;display:flex;justify-content:space-between;color:#999;font-size:11px}
.spark-wrap{height:42px;margin-top:12px;border-top:1px solid #f0f0f0;padding-top:8px}.sparkline{display:block;width:100%;height:34px}.spark-label{display:flex;justify-content:space-between;color:#aaa;font-size:10px;margin-top:3px}
@media(max-width:600px){.wrap{padding:0 15px}header{height:68px}.brand{font-size:23px}.subscribe{font-size:12px;padding:9px 11px}main{padding-top:38px}.hero h1{font-size:29px}.status-body{display:block}.status-time{text-align:left;margin-top:8px}.system-head{align-items:flex-start;gap:10px}.range{font-size:12px}.panel-head{padding:0 16px}.service{padding:17px 16px}.service-meta{font-size:12px}.bars{gap:2px}.uptime-value{font-size:12px}}
</style>
</head>
<body><div class="wrap">
<header><div class="brand">QMKJCM</div><a class="subscribe" href="https://github.com/qmkjcm/status" target="_blank" rel="noopener">订阅更新</a></header>
<main>
<section class="hero"><h1>服务状态</h1><p>倾慕系列服务的实时运行情况与历史可用性。</p></section>
<section class="status-box"><div class="status-head"><span id="overallIcon" class="check">✓</span><strong id="overall">正在检查服务状态</strong></div><div class="status-body"><span id="overallDesc">正在连接监控系统</span><span id="updated" class="status-time">—</span></div></section>
<section><div class="system-head"><h2>系统状态</h2><div class="range"><span class="arrow">‹</span><span id="range">最近 30 天</span><span class="arrow">›</span></div></div><div id="services" class="panel"><div class="empty">正在加载…</div></div><div class="history"><a href="https://github.com/qmkjcm/status/commits/main" target="_blank" rel="noopener"><span class="calendar">▣</span>查看状态页更新记录</a></div></section>
<section class="events"><h2>近期事件</h2><div id="incidents" class="event-box"><div class="empty">正在读取…</div></div></section>
</main><footer><span>© 2026 QMKJCM</span><span>数据由独立外部监控节点提供</span></footer>
</div>
<script>
(function(){
'use strict';
var servicesBox=document.getElementById('services'),incidentsBox=document.getElementById('incidents');
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(v){var d=new Date(v);if(isNaN(d.getTime()))return'—';var p=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),o={};p.forEach(function(x){o[x.type]=x.value});return o.year+'-'+o.month+'-'+o.day+' '+o.hour+':'+o.minute}
function ts(v){return v?fmt(Number(v)*1000)+' 北京时间':'—'}
function state(s){return s==='down'?['down','服务中断']:s==='warn'?['warn','性能下降']:['up','正常运行']}
function dayKey(ms){var d=new Date(ms);return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate()}
function bars(service){var now=new Date(),today=dayKey(now.getTime()),inc=Array.isArray(service.incidents)?service.incidents:[],st=state(service.status)[0],html='';for(var i=29;i>=0;i--){var d=new Date(now.getTime()-i*86400000),key=dayKey(d.getTime()),down=inc.some(function(x){return dayKey(Number(x.at)*1000)===key&&x.type==='down'}),c=down?'down':(st==='down'?'down':st==='warn'?'warn':'up'),label=fmt(d)+' 北京时间 · '+(down?'发生中断':c==='warn'?'性能下降':'无事件');html+='<i class="'+c+'" title="'+esc(label)+'"></i>'}return html}
function spark(points,status){var a=Array.isArray(points)?points.slice().reverse().filter(function(x){return Number(x.ms)>=0}):[];if(!a.length)return'<span style="color:#aaa;font-size:10px">暂无响应趋势数据</span>';var vals=a.map(function(x){return Number(x.ms)||0}),min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),span=max-min||1,w=640,h=34,p=2,pts=a.map(function(x,i){var xx=p+(w-p*2)*(a.length===1?1:i/(a.length-1)),yy=h-p-(h-p*2)*((Number(x.ms)-min)/span);return xx.toFixed(1)+','+yy.toFixed(1)}).join(' '),color=status==='down'?'#f47768':status==='warn'?'#d39c16':'#20a477';return'<svg class="sparkline" viewBox="0 0 640 34" preserveAspectRatio="none" role="img" aria-label="响应时间折线图"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>'}
function renderIncidents(list){var rows=[];list.forEach(function(s){(s.incidents||[]).forEach(function(e){if(e.type==='down')rows.push({name:s.name,at:e.at,duration:e.duration,reason:e.reason})})});rows.sort(function(a,b){return b.at-a.at});if(!rows.length){incidentsBox.innerHTML='<div class="empty">最近没有服务中断事件</div>';return}incidentsBox.innerHTML=rows.slice(0,6).map(function(e){var mins=Math.round((Number(e.duration)||0)/60);return'<div class="event"><span class="event-dot"></span><div><b>'+esc(e.name)+' 曾发生中断</b><p>'+esc(ts(e.at))+' · 持续 '+(mins?mins+' 分钟':'不足 1 分钟')+(e.reason?' · '+esc(e.reason):'')+'</p></div></div>'}).join('')}
function render(data){var list=Array.isArray(data.services)?data.services:[],down=list.filter(function(x){return x.status==='down'}).length,warn=list.filter(function(x){return x.status==='warn'}).length,total=list.length,good=total&&!down&&!warn;document.getElementById('overall').textContent=down?'部分系统服务中断':warn?'部分系统性能下降':good?'所有系统正常':'暂时无法获取状态';document.getElementById('overallDesc').textContent=down?'我们正在处理受影响的服务。':warn?'部分服务响应较慢，请稍后再查看。':good?'我们没有发现影响服务的问题。':'请稍后重新检查。';document.getElementById('updated').textContent=data.updated_at?'更新于 '+fmt(data.updated_at)+' 北京时间':'—';document.getElementById('overallIcon').style.background=down?'#f47768':warn?'#f5b629':'#20b486';document.getElementById('range').textContent='最近 30 天';servicesBox.innerHTML=list.length?'<div class="panel-head">倾慕系列服务</div>'+list.map(function(x){var st=state(x.status),last=x.response_times&&x.response_times[0],lat=last?last.ms:(x.edge_latency_ms!=null?x.edge_latency_ms:null),rate=x.uptime_30d?Number(x.uptime_30d).toFixed(2)+'%':'—',check=x.checked_at?fmt(x.checked_at)+' 北京时间':(last?ts(last.at):'—');return'<div class="service"><div class="service-top"><div><div class="service-title"><span class="check">✓</span><span class="service-name">'+esc(x.name)+'</span></div><div class="service-meta">'+esc(x.domain||'未公开域名')+' · '+esc(x.type||'HTTP')+' · 1 个组件</div></div><div class="uptime-value">'+esc(rate)+' uptime</div></div><div class="bars">'+bars(x)+'</div><div class="spark-wrap">'+spark(x.response_times,st[0])+'<div class="spark-label"><span>响应时间趋势</span><span>最新检查：'+esc(check)+'</span></div></div><div class="legend"><span>最近 30 天可用性</span><span>绿色=正常 · 黄色=性能下降 · 红色=中断</span></div></div>'}).join(''):'<div class="empty">暂时无法获取监控数据，请稍后重试。</div>';renderIncidents(list)}
function load(){var timeout=new Promise(function(_,reject){setTimeout(function(){reject(Error('timeout'))},8000)});Promise.race([fetch('/api/status'),timeout]).then(function(r){if(!r.ok)throw Error(String(r.status));return r.json()}).then(function(data){render(data);try{localStorage.setItem('qmkjcm_status_cache_v3',JSON.stringify(data))}catch(_){}}).catch(function(error){var saved=null;try{saved=localStorage.getItem('qmkjcm_status_cache_v3')}catch(_){}if(saved){try{render(JSON.parse(saved));document.getElementById('overallDesc').textContent='实时刷新失败，当前显示缓存数据';return}catch(_){}}document.getElementById('overall').textContent='暂时无法获取状态';document.getElementById('overallDesc').textContent='接口请求失败，请稍后重试（'+esc(error&&error.message||'network_error')+'）';servicesBox.innerHTML='<div class="empty">暂时无法获取监控数据，请稍后重试。</div>';incidentsBox.innerHTML='<div class="empty">事件数据暂时不可用</div>'})}
load();setInterval(load,300000);
})();
</script>
</body></html>
